name: Godot verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
      - name: Import and parse project
        run: godot --headless --path . --editor --quit
      - name: Load main scene
        run: godot --headless --path . --quit-after 5
      - name: Test core gameplay
        run: godot --headless --path . --script res://tests/smoke_test.gd
      - name: Exercise UI screens and actions
        run: |
          set -o pipefail
          timeout 50s godot --headless --path . --script res://tests/ui_smoke_test.gd 2>&1 | tee /tmp/ui_smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/ui_smoke.log; then exit 1; fi
          grep -F 'Guild Ledger UI navigation, guild work recovery, and legacy operations passed.' /tmp/ui_smoke.log
      - name: Verify UI at 1280x720
        run: |
          set -o pipefail
          timeout 50s godot --headless --resolution 1280x720 --path . --script res://tests/ui_smoke_test.gd 2>&1 | tee /tmp/ui_720p.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/ui_720p.log; then exit 1; fi
          grep -F 'Guild Ledger UI navigation, guild work recovery, and legacy operations passed.' /tmp/ui_720p.log
      - name: Verify BookUI chapters and page-turn sprites
        run: |
          set -o pipefail
          timeout 70s godot --headless --path . --script res://tests/book_ui_smoke_test.gd 2>&1 | tee /tmp/book_ui.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/book_ui.log; then exit 1; fi
          grep -F 'BookUI page navigation, equipment desk, merchant selection, and page-turn assets passed.' /tmp/book_ui.log
      - name: Harlow Mines as a site, and old Harlow trips
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/harlow_smoke_test.gd 2>&1 | tee /tmp/harlow_test.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/harlow_test.log; then
            exit 1
          fi
          grep -F 'Harlow Mines site and legacy trip settlement passed.' /tmp/harlow_test.log

      - name: V0.5 regression (gear, permadeath, recruitment, migration)
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/v05_smoke_test.gd 2>&1 | tee /tmp/v05.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/v05.log; then exit 1; fi
          grep -F 'V0.5 equipment, permadeath, partial mining, debt, and migration tests passed.' /tmp/v05.log

      - name: Fallen gear (drop pool, shares, finds)
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/fallen_gear_test.gd 2>&1 | tee /tmp/fallen.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/fallen.log; then exit 1; fi
          grep -F 'Fallen gear pool, shares, finds and the trip home passed.' /tmp/fallen.log

      - name: Dungeons (fights, check-ins, death rule)
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/dungeons_test.gd 2>&1 | tee /tmp/dungeons.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/dungeons.log; then exit 1; fi
          grep -F 'Dungeon checks passed.' /tmp/dungeons.log

      - name: Tutorial (first-launch steps, card, pointer)
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/tutorial_test.gd 2>&1 | tee /tmp/tutorial.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/tutorial.log; then exit 1; fi
          grep -F 'Tutorial checks passed.' /tmp/tutorial.log

      - name: Heroes and the crypt crawl (engine, led runs, slots, migration)
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/crawl_test.gd 2>&1 | tee /tmp/crawl.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/crawl.log; then exit 1; fi
          grep -F 'Crawl checks passed.' /tmp/crawl.log

      - name: Crypt event card (shows, answers, fits its result)
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/event_card_test.gd 2>&1 | tee /tmp/event_card.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/event_card.log; then exit 1; fi
          grep -F 'Event card checks passed.' /tmp/event_card.log

      - name: Sound (name table, files, groups, clicks, ambience)
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/sound_test.gd 2>&1 | tee /tmp/sound.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/sound.log; then exit 1; fi
          grep -F 'Sound checks passed.' /tmp/sound.log

      - name: Auction House (listings, orders, sales over time)
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/auction_test.gd 2>&1 | tee /tmp/auction.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/auction.log; then exit 1; fi
          grep -F 'Auction House checks passed.' /tmp/auction.log

      - name: Long orders, mining sites, contractors
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/viability_test.gd 2>&1 | tee /tmp/viability.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/viability.log; then exit 1; fi
          grep -F 'Long orders, mining sites and guild contractors passed.' /tmp/viability.log

      - name: Item catalog integrity
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/catalog_test.gd 2>&1 | tee /tmp/catalog.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/catalog.log; then exit 1; fi
          grep -F 'Catalog passed:' /tmp/catalog.log

      - name: Mercenaries, traits, reputation and contracts
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . --script res://tests/mercs_test.gd 2>&1 | tee /tmp/mercs.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/mercs.log; then exit 1; fi
          grep -F 'Mercenaries, traits, reputation and contracts passed.' /tmp/mercs.log

      - name: Crafting, gear, wear, repairs and supplies
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/crafting_test.gd 2>&1 | tee /tmp/crafting.log
          if grep -E 'SCRIPT ERROR|ERROR:|Assertion failed|Invalid call|Parse Error' /tmp/crafting.log; then exit 1; fi
          grep -F 'Crafting, gear, wear, repairs and supplies passed.' /tmp/crafting.log
