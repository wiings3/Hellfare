name: Visual UI snapshot
on:
  push:
    paths:
      - "tests/capture_ui.gd"
      - ".github/workflows/visual-preview.yml"
      - "scripts/ledger_ui.gd"
      - "scripts/guildhall_ui.gd"
      - "scripts/book_ui.gd"
      - "assets/BookUI/**"
      - "scenes/main.tscn"
      - "assets/ui/**"
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
      - name: Import SVG assets
        run: godot --headless --path . --editor --quit
      - name: Render Harlow screenshot with Xvfb
        run: |
          set -o pipefail
          timeout 50s xvfb-run -a -s "-screen 0 1440x900x24" godot --path . --rendering-method gl_compatibility --resolution 1440x900 --script res://tests/capture_ui.gd
      - name: Render widescreen UI at 1920x1080
        run: |
          set -o pipefail
          timeout 75s xvfb-run -a -s "-screen 0 1920x1080x24" env MM_CAPTURE_WIDE=1 godot --path . --rendering-method gl_compatibility --resolution 1920x1080 --script res://tests/capture_ui.gd
      - name: Store visual QA snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui_*_preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "docs: Guild Ledger visual QA snapshots [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish UI snapshots after three safe retries." >&2
            exit 1
          fi
